name: API CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: valryde_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valryde_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/valryde_test
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/valryde_test
      TEST_DATABASE_SCHEMA: dbo
      DATABASE_SSL: "false"
      DATABASE_SCHEMA: dbo

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Generate ephemeral JWT signing secret
        shell: bash
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
